<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuto</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1428;
      --ink: #e7eef8;
      --card: #141c34;
      --primary: #e0a24a;
      --primary-ink: #1a1408;
      --muted: #a9b6cb;
      --line: #314266;
      --moss: #d5e4c4;
      --bad: #f3c7bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 42% 32% at 92% 0%, rgba(244, 247, 255, 0.16), transparent 62%),
        radial-gradient(ellipse 55% 42% at 12% -10%, rgba(86, 114, 186, 0.38), transparent 68%),
        linear-gradient(180deg, #090f1e 0%, #121a34 48%, #0b1326 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 1.75rem 1.25rem 3rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand svg {
      width: 3.4rem;
      height: 2.2rem;
      flex: none;
    }
    .mark {
      margin: 0;
      font-family: Palatino, "Palatino Linotype", Georgia, "Times New Roman", serif;
      font-size: 2.4rem;
      line-height: 1;
    }
    .crenel {
      height: 14px;
      margin: 1rem -1.25rem 0;
      background:
        repeating-linear-gradient(90deg, #e2b15a 0 12px, transparent 12px 28px) top / 100% 8px no-repeat,
        linear-gradient(#6e522c, #6e522c) bottom / 100% 6px no-repeat;
    }
    h1 {
      margin: 1.15rem 0 0;
      font-family: Palatino, "Palatino Linotype", Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      font-weight: 500;
      line-height: 1.2;
    }
    .sub {
      margin: 0.7rem 0 0;
      color: var(--muted);
      line-height: 1.45;
    }
    .pick {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 3.6rem;
      margin-top: 0.85rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 600;
      overflow: hidden;
    }
    .pick input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      font-size: 16px;
    }
    .camera {
      margin-top: 1.5rem;
      background: var(--primary);
      color: var(--primary-ink);
    }
    .library {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    ul {
      list-style: none;
      margin: 1.5rem 0 0;
      padding: 0;
    }
    li {
      margin-top: 0.85rem;
      padding: 0.85rem 0.95rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 1rem;
    }
    .name {
      margin: 0;
      font-weight: 600;
      word-break: break-word;
    }
    .bar {
      height: 0.4rem;
      margin-top: 0.55rem;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0;
      background: var(--primary);
    }
    .state {
      margin: 0.45rem 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .state.ok { color: var(--moss); font-weight: 600; }
    .state.bad { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg aria-hidden="true" viewBox="0 0 72 36">
        <circle cx="60" cy="10" r="8" fill="#f4f7ff"></circle>
        <g fill="#e2b15a">
          <rect x="1" y="20" width="44" height="14"></rect>
          <rect x="1" y="12" width="10" height="10"></rect>
          <rect x="18" y="12" width="10" height="10"></rect>
          <rect x="35" y="12" width="10" height="10"></rect>
        </g>
      </svg>
      <p class="mark">Tuto</p>
    </div>
    <div class="crenel" aria-hidden="true"></div>
    <h1>Send papers to the laptop</h1>
    <p class="sub">They stay on that machine. This page does not use the internet.</p>
    <label class="pick camera">
      Take photo
      <input id="camera" type="file" accept="image/*,application/pdf" capture="environment" multiple>
    </label>
    <label class="pick library">
      Choose files
      <input id="library" type="file" accept="image/*,application/pdf" multiple>
    </label>
    <ul id="list"></ul>
  </main>
  <script>
    (function () {
      var list = document.getElementById("list");
      var queue = [];
      var busy = false;
      var limit = 25 * 1024 * 1024;

      function rowFor(file) {
        var li = document.createElement("li");
        var name = document.createElement("p");
        name.className = "name";
        name.textContent = file.name || "photo";
        var bar = document.createElement("div");
        bar.className = "bar";
        var fill = document.createElement("div");
        fill.className = "fill";
        bar.appendChild(fill);
        var state = document.createElement("p");
        state.className = "state";
        state.textContent = "Waiting…";
        li.appendChild(name);
        li.appendChild(bar);
        li.appendChild(state);
        list.appendChild(li);
        return { fill: fill, state: state, bar: bar };
      }

      function finish(row, ok, text) {
        row.bar.remove();
        row.state.textContent = text;
        row.state.className = ok ? "state ok" : "state bad";
      }

      function attempt(file, row, triesLeft, done) {
        var xhr = new XMLHttpRequest();
        xhr.open("POST", location.pathname);
        xhr.timeout = 180000;
        xhr.upload.onprogress = function (event) {
          if (!event.lengthComputable || event.total === 0) {
            return;
          }
          var pct = Math.round((event.loaded / event.total) * 100);
          row.fill.style.width = pct + "%";
          row.state.textContent = pct >= 100 ? "Waiting for the laptop…" : "Sending " + pct + "%";
        };
        xhr.onload = function () {
          var data = {};
          try {
            data = JSON.parse(xhr.responseText || "{}");
          } catch (error) {
            data = {};
          }
          if (xhr.status >= 200 && xhr.status < 300 && data.ok) {
            finish(row, true, "\u2713 Saved on the laptop");
            done();
            return;
          }
          var detail = data.error || ("HTTP " + xhr.status);
          finish(row, false, detail);
          done();
        };
        function again(label) {
          if (triesLeft > 1) {
            row.state.textContent = "Trying again…";
            setTimeout(function () { attempt(file, row, triesLeft - 1, done); }, 700);
            return;
          }
          finish(row, false, label);
          done();
        }
        xhr.onerror = function () {
          again("Could not reach the laptop (network error). Stay on the same Wi-Fi and try again.");
        };
        xhr.ontimeout = function () {
          again("The laptop took too long (timed out). Try a smaller photo.");
        };
        var body = new FormData();
        body.append("file", file, file.name || "photo");
        row.state.textContent = triesLeft < 3 ? "Trying again…" : "Sending…";
        xhr.send(body);
      }

      function send(file, done) {
        var row = rowFor(file);
        var name = (file.name || "").toLowerCase();
        if (name.endsWith(".heic") || name.endsWith(".heif")) {
          finish(row, false, "This photo is HEIC. Set the camera to JPEG and take it again.");
          done();
          return;
        }
        if (file.size > limit) {
          finish(row, false, "Larger than 25 MB.");
          done();
          return;
        }
        attempt(file, row, 3, done);
      }

      function pump() {
        if (busy || queue.length === 0) {
          return;
        }
        busy = true;
        var file = queue.shift();
        send(file, function () {
          busy = false;
          pump();
        });
      }

      function take(input) {
        var files = input.files ? Array.prototype.slice.call(input.files) : [];
        input.value = "";
        files.forEach(function (file) { queue.push(file); });
        pump();
      }

      document.getElementById("camera").addEventListener("change", function (event) {
        take(event.target);
      });
      document.getElementById("library").addEventListener("change", function (event) {
        take(event.target);
      });
    })();
  </script>
</body>
</html>
